name: Price Tracker Scanner

on:
  push:
    branches: [ main ]
  schedule:
    # Ogni 30 minuti, non 15: il run completo dura ~13 min (Subito ne prende
    # 3, il resto sono Amazon e NorthLadder via Playwright) e a 15 minuti il
    # margine era di novanta secondi. A 30 il turno successivo parte sempre a
    # tavolo libero.
    - cron: '*/30 * * * *'
  workflow_dispatch:

# Rete di sicurezza contro l'accavallamento: un run per volta, in coda e non
# annullato, cosi' una scansione lunga non si ritrova a spingere su main
# insieme a quella partita dal cron successivo.
concurrency:
  group: scanner
  cancel-in-progress: false

# Niente piu' pages/deployments/id-token: dal 28/08/2026 la dashboard sta su
# Vercel e questo workflow non pubblica piu' niente su GitHub Pages. Restano i
# due permessi che servono davvero: committare i dati e ripulire i run vecchi.
permissions:
  contents: write
  actions: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run Price Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python run_once.py

      - name: Build Dashboard for Vercel
        run: |
          # Il tabellone su Vercel non contiene dati: li chiede a /api/store
          # all'apertura. Va rigenerato solo quando cambiano il template o i
          # fogli di stile, quindi di norma questo passo non produce nessun
          # diff — e' qui perche' una modifica al template arrivi su Vercel
          # senza doversi ricordare di lanciare lo script a mano.
          python export_vercel.py

      - name: Save Scan Data to Main Branch
        run: |
          git config --global user.name "mich-de"
          git config --global user.email "mic.deangelis@gmail.com"
          # Solo dati, piu' vercel/index.html quando cambia il template. La
          # dashboard non ha piu' bisogno di essere ricommittata a ogni giro:
          # su Vercel la pagina non contiene dati, li chiede a /api/store
          # quando la si apre.
          git add -f data/sent_items.json data/*_results.json data/northladder_history.json vercel/index.html || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Chore: Save scan results and sent items history [skip ci]"
          git push origin main || true

      - name: Purge Old Workflow Runs Automatically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          # Prima chiedeva workflow_runs[1:] senza filtri: teneva UN SOLO run e
          # cancellava tutti gli altri, compresi quelli in coda o in esecuzione.
          # Un run appena lanciato spariva prima di partire e il sito non veniva
          # mai pubblicato. Qui si toccano solo i run gia' conclusi, si salta
          # sempre quello corrente e se ne conservano dieci per poter indagare.
          curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/runs?per_page=100&status=completed" \
            | jq -r --arg current "$CURRENT_RUN" \
                '.workflow_runs
                 | map(select(.id != ($current | tonumber)))
                 | .[10:][].id' \
            | while read -r run_id; do
                [ -n "$run_id" ] || continue
                curl -s -X DELETE -H "Authorization: token $GH_TOKEN" \
                  "https://api.github.com/repos/$REPO/actions/runs/$run_id"
              done

# Qui c'era il job "deploy", che pubblicava su GitHub Pages. Non esiste piu':
# GitHub e' il repository e lo scanner, la pagina web sta su Vercel. Un solo
# tabellone, quindi nessun dubbio su quale dei due dica il vero.
