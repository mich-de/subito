name: Price Tracker Scanner

on:
  push:
    branches: [ main ]
  schedule:
    # Esegue ogni 15 minuti automaticamente
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pages: write
  deployments: write
  actions: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run Price Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python run_once.py

      - name: Build Static Dashboard for GitHub Pages
        run: |
          python export_pages.py
          # export_pages.py scrive in public/, ma Pages in modalita' branch
          # serve la root: senza questa copia il sito resta fermo all'ultimo
          # index.html committato a mano, con i dati del giorno in cui e'
          # stato creato. Tornando a build_type=workflow, togliere le due
          # righe (l'artifact si prende public/ da solo).
          cp public/index.html index.html
          cp public/.nojekyll .nojekyll

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: 'public'

      - name: Save Scan Data to Main Branch
        run: |
          git config --global user.name "mich-de"
          git config --global user.email "mic.deangelis@gmail.com"
          # Dati + index.html: dal 26/08/2026 Pages pubblica dal branch, non
          # dall'artifact, quindi la dashboard in root va rigenerata a ogni
          # scansione o il sito resta fermo ai dati del giorno del passaggio.
          # Tornando a build_type=workflow, togliere index.html da questa riga.
          git add -f data/sent_items.json data/*_results.json data/northladder_history.json index.html || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Chore: Save scan results and sent items history [skip ci]"
          git push origin main || true

      - name: Rebuild GitHub Pages from Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Il commit dei dati porta [skip ci], quindi la ricostruzione
          # automatica di Pages non scatta e il sito resterebbe fermo
          # all'ultimo index.html pubblicato. Va chiesta esplicitamente.
          # Passo necessario solo finche' Pages e' in modalita' branch.
          curl -s -X POST -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages/builds" > /dev/null || true

      - name: Purge Old Workflow Runs Automatically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          # Prima chiedeva workflow_runs[1:] senza filtri: teneva UN SOLO run e
          # cancellava tutti gli altri, compresi quelli in coda o in esecuzione.
          # Un run appena lanciato spariva prima di partire e il sito non veniva
          # mai pubblicato. Qui si toccano solo i run gia' conclusi, si salta
          # sempre quello corrente e se ne conservano dieci per poter indagare.
          curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/runs?per_page=100&status=completed" \
            | jq -r --arg current "$CURRENT_RUN" \
                '.workflow_runs
                 | map(select(.id != ($current | tonumber)))
                 | .[10:][].id' \
            | while read -r run_id; do
                [ -n "$run_id" ] || continue
                curl -s -X DELETE -H "Authorization: token $GH_TOKEN" \
                  "https://api.github.com/repos/$REPO/actions/runs/$run_id"
              done

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: scan
    # Con Pages in modalita' branch questo passo fallisce per forza: deploy-pages
    # sa parlare solo con build_type=workflow. Non e' un errore da inseguire,
    # e' il prezzo della pubblicazione da branch. Rimettere a false quando si
    # torna all'artifact.
    continue-on-error: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5

      - name: Cleanup Old Deployments Automatically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEPLOYS=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/mich-de/subito/deployments" | jq -r '.[].id')
          for id in $DEPLOYS; do
            curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" "https://api.github.com/repos/mich-de/subito/deployments/$id/statuses" -d '{"state":"inactive"}'
            curl -s -X DELETE -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/mich-de/subito/deployments/$id"
          done
